; Anomaly mod configuration
; Each section is a mod name with include = true/false to enable/disable
; rewrite_files lists files that need tag processing during build

[config]

[Dynamic Items And Anomalies Anomaly]
include = true

[_New Game Start Locations Anomaly]
include = true
rewrite_files = configs/plugins/new_game_start_locations.ltx

[Sleeper Scheme Fixes - Leyths]
include = true

[Main Story Fixes - Leyths]
include = true
rewrite_files = scripts/main_story_spawn_fixes.script
                scripts/main_story_dialogs_fixes.script

[Modular Level Changers - Leyths]
include = true